<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>WhatsCord</title>
    <!--
      Pinta o tema ANTES do CSS e do React. Se isto fosse feito no main.tsx,
      quem escolheu claro veria a tela escura por um quadro a cada abertura —
      o "flash of wrong theme". Precisa ser bloqueante e inline; um módulo
      externo, mesmo pequeno, já chega tarde demais.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("whatscord.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia &&
            matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
