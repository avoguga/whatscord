[package]
name = "whatscord-desktop"
version = "0.2.9"
description = "WhatsCord desktop shell"
authors = ["WhatsCord"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Tauri v2 template splits the app into a lib (so mobile targets can reuse it)
# and a thin main.rs binary. Keep the `_lib` suffix: main.rs refers to it by name.
name = "whatscord_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# `tray-icon`: fechar a janela esconde o app na bandeja em vez de encerrar,
# como WhatsApp e Discord fazem. Sem esta feature o `TrayIconBuilder` nem
# existe.
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-store = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.10"
# O idioma do SISTEMA, perguntado ao SO e nao ao navegador. Dentro da WebView2
# do Windows `navigator.language` nao reflete de forma confiavel a configuracao
# do sistema (wry#442), entao o app instalado poderia abrir em ingles numa
# maquina em portugues. 1 KB de crate resolve a primeira impressao do produto.
sys-locale = "0.3"

# Acesso direto a WebView2 para CONCEDER a permissao de microfone e camera de
# forma persistida. Nao e enfeite: sem ela o `enumerateDevices` do navegador
# devolve dispositivos sem nome e sem id, e a tela de escolher microfone fica
# vazia. Ver `conceder_midia` em lib.rs. Ambas ja vinham como dependencia
# transitiva do proprio Tauri; aqui so passam a ser diretas.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
# Registro do Windows, para abrir com o sistema (ver src/inicializacao.rs). A
# mesma versao que ja vinha por dependencia transitiva — nada novo compilado.
winreg = "0.55"

# single-instance is desktop-only: it has no mobile implementation and fails to
# build for iOS/Android, so it is gated behind a target cfg (as the docs require).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.4"
# Atualizacao dentro do app. So desktop pelo mesmo motivo do single-instance:
# nao ha implementacao mobile — no Android, atualizar e instalar o APK por cima.
# 2.x e nao a 3.0-alpha que o `cargo search` mostra: essa e do Tauri 3.
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
