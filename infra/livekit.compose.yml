# LiveKit SFU — recurso "whatscord-livekit" no Coolify.
#
# network_mode: host NAO e otimizacao, e requisito. A doc oficial diz "If running
# in a Dockerized environment, host networking should be used". Em bridge o
# Coolify anexa o container a DUAS redes e o LiveKit abre um socket por interface
# (nunca em 0.0.0.0): o pacote do cliente entrava por uma e a resposta ICE saia
# pela outra, morrendo dentro do container. Nenhuma chamada externa conectava.
# Diagnostico completo em docs/livekit-coolify.md.
#
# Consequencias de estar em host:
#  - sem `ports:` (nao ha o que publicar) e sem `networks:` — o Coolify para de
#    injetar o bloco quando network_mode esta definido (coolify PR #6235).
#  - o Traefik nao roteia mais por label; o roteamento HTTPS vai em
#    infra/traefik-livekit.yml, que precisa ser copiado para
#    /data/coolify/proxy/dynamic/ na VPS.
#  - a 7880 fica acessivel sem TLS direto no IP publico.
#
# Mux com 4 portas, uma por vCPU: o config-sample.yaml oficial recomenda faixa
# >= numero de vCPUs. No mux as portas escalam com paralelismo de CPU, nao com
# participantes. Nao confundir com port_range_start/end (modo classico, portas
# dedicadas por participante), que e de onde vem a faixa 50000-60000 da doc.
#
# node_ip fixo em vez de use_external_ip: evita o self-ping de validacao por STUN
# e faz anunciar so o IP publico, em vez de todas as gateways de bridge do host.
#
# Redis desligado de proposito: habilita-lo poe o LiveKit em modo distribuido,
# que so traz ganho com 2+ nos.
#
# A chave e o segredo sao substituidos no deploy a partir de .secrets/generated.env.
services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    network_mode: host
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 1.5
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          udp_port: 7882-7885
          tcp_port: 7881
          use_external_ip: false
          node_ip: 167.88.39.225
        keys:
          __LK_KEY__: __LK_SECRET__
        logging:
          level: info
          pion_level: error
          json: true
          sample: true
    labels:
      - traefik.enable=false
